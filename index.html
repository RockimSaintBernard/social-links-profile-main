<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->


    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"/>

    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
     <style>
      *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
   
}

body{
    font-family: 'Poppins', sans-serif;
    color: hsl(0, 0%, 100%) ;
     background-color:  hsl(0, 0%, 8%);
}

.container{
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

  .card{
    background-color: hsl(0, 0%, 12%);
    width: 400px;
    height: 650px;
    border-radius: 15px;    
    align-items: center;
    text-align: center;
    justify-content: center;
    gap: 20px;
    padding: 20px;
  }

  img{
    border-radius: 50%;
    width: 125px;
    height: 125px;
    margin-top: 20px;
  }

  .address{
    color: hsl(75, 94%, 57%);
    font-size: 18px;
    margin-bottom: 25px;
    font-weight: 500;
  }

  .buttons{
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 30px 30px;
    padding: 20px;
    align-items: center;
    justify-content: center;
    
  }

  .btn-follow{
    background-color: hsl(0, 0%, 20%);
    color: white;
    border: none;
    border-radius: 8px;
    width: 300px;
    height: 40px;
    font-size: 16px;
    cursor: pointer;
    font-weight: 700;
  }

  .active, .btn-follow:hover{
    background-color: hsl(75, 94%, 57%);
    color: hsl(0, 0%, 8%);
    font-weight: 700;

  }


      .attribution {
        margin-top: 20px;
        font-size: 15px;
        text-align: center;
        color: white;

      }
      .attribution a {
        color: white;
      }
      </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img
          src="./assets/images/avatar-jessica.jpeg"
          alt="Profile Picture of Victor Crest"
          class="profile-picture"
        />
        <h1 class="name">Jessica Randal</h1>
        <p class="address">London, United Kingdom</p>

        <p>"Front-end developer and avid reader"</p>

        <div class="buttons">
          <button class="btn-follow">GitHub</button>
          <button class="btn-follow">Frontend Mentor</button>
          <button class="btn-follow">LinkIn</button>
          <button class="btn-follow">Twitter</button>
          <button class="btn-follow">Instagram</button>
        </div>
        


      <p></p>
    </div>
    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="http://rock-io.com/">Rockim St. Bernard</a>.
    </div>
  </body>
    <script>
    console.log("Hello, world!");

// Get all buttons with the btn-follow class
var buttons = document.querySelectorAll(".btn-follow");

// Add click event listener to each button
buttons.forEach(function (button) {
  button.addEventListener("click", function () {
    console.log("Button clicked!");
    // Remove active class from all buttons
    buttons.forEach(function (btn) {
      btn.classList.remove("active");
    });
    // Add active class to the clicked button
    button.classList.add("active");
  });
});
    </script>
</html>
